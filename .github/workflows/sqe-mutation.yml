name: SQE mutation CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  mutation:
    name: SQE Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Record PR revisions and install pinned dependencies
        shell: bash
        run: |
          mkdir -p mutation-evidence
          {
            printf 'Tested merge candidate %s\nPR head %s\nPR base %s\n' "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA"
            git rev-parse HEAD
            git rev-parse HEAD:src
            python --version
            cat /etc/os-release
            uname -m
          } > mutation-evidence/environment.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m venv "$RUNNER_TEMP/sqe-tools"
          python -m venv "$RUNNER_TEMP/sqe-tests"
          "$RUNNER_TEMP/sqe-tools/bin/python" -m pip install -r tests/team/mutation/runner-dependencies.txt
          "$RUNNER_TEMP/sqe-tests/bin/python" -m pip install -r tests/team/mutation/test-dependencies.txt
          "$RUNNER_TEMP/sqe-tools/bin/python" -m pip freeze > mutation-evidence/runner-dependencies.txt
          "$RUNNER_TEMP/sqe-tests/bin/python" -m pip freeze > mutation-evidence/test-dependencies.txt

      - name: Verify control and evaluate the mutation gate
        shell: bash
        run: |
          set -o pipefail
          base_sha="${PR_BASE_SHA:-$(git rev-parse "$GITHUB_SHA^1")}"
          run_dir="$RUNNER_TEMP/sqe-mutation"
          git clone --quiet --no-checkout --shared "$GITHUB_WORKSPACE" "$run_dir/control"
          git -C "$run_dir/control" checkout --quiet --detach "$GITHUB_SHA"
          "$RUNNER_TEMP/sqe-tools/bin/python" tests/team/mutation/run_campaign.py \
            --sandbox "$run_dir" --output "$GITHUB_WORKSPACE/mutation-evidence" \
            --test-python "$RUNNER_TEMP/sqe-tests/bin/python" --workers 3 \
            --candidate-sha "$GITHUB_SHA" --base-sha "$base_sha" \
            |& tee mutation-evidence/campaign-console.txt

      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqe-mutation-gate-evidence
          path: mutation-evidence/
          if-no-files-found: error
