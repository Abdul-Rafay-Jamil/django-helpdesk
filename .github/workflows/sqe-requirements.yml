name: SQE requirement gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements:
    name: SQE Requirement Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - name: Install requirement-test dependencies
        run: |
          python -m pip install -e . Django==6.1.3 djangorestframework==3.18.3 pytest==9.2.0 pytest-django==4.14.0
      - name: Run all 77 requirements
        shell: bash
        run: |
          mkdir -p requirement-results
          {
            git rev-parse HEAD
            python --version
            python -m pip freeze
          } > requirement-results/environment.txt
          python -m pytest -v --ds=tests.test_settings \
            -o junit_suite_name=sqe-pr-requirements \
            --junitxml=requirement-results/requirements-junit.xml \
            tests/team/requirements | tee requirement-results/requirements-pytest.txt
      - name: Check that all 77 cases ran
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          from xml.etree.ElementTree import parse

          suite = parse("requirement-results/requirements-junit.xml").getroot().find("testsuite")
          if suite is None or any(suite.get(key) != expected for key, expected in
                                  {"tests": "77", "errors": "0", "skipped": "0"}.items()):
              raise SystemExit("Expected 77 executed requirements with zero errors or skips.")
          print(f"{suite.get('tests')} executed, {suite.get('failures')} requirement failures")
          PY
      - name: Preserve requirement evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sqe-requirement-results
          path: requirement-results/
          if-no-files-found: error
