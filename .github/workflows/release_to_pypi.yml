name: Publish an SQE-verified build to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag at the selected main commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Verify the protected release candidate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the selected main commit and matching release tag
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

  requirements:
    needs: candidate
    uses: ./.github/workflows/sqe-requirements.yml

  mutation:
    needs: candidate
    uses: ./.github/workflows/sqe-mutation.yml

  quality:
    needs: candidate
    uses: ./.github/workflows/sqe-quality.yml

  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: [candidate, requirements, mutation, quality]
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install yarn dependencies
        run: yarn install

      - name: Build static assets
        run: yarn build:static

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
